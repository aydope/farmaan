<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta -->
    <title>Farmaan | فرمانروایی بر زمان</title>
    <meta name="title" content="Farmaan | فرمانروایی بر زمان" />
    <meta
      name="description"
      content="اپلیکیشن مدیریت وظایف پارسی - فرمان بده، انجام بده، حکومت کن"
    />
    <meta
      name="keywords"
      content="todo, persian, task manager, farmaan, فرمان, rtl, وظیفه, مدیریت کار, فارسی, شاهانه"
    />
    <meta name="author" content="Farmaan" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="Persian" />

    <!-- Theme -->
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Farmaan | فرمانروایی بر زمان" />
    <meta property="og:description" content="فرمان بده، انجام بده، حکومت کن" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:site_name" content="Farmaan" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Farmaan | فرمانروایی بر زمان" />
    <meta name="twitter:description" content="فرمان بده، انجام بده، حکومت کن" />

    <!-- Internal Libraries -->
    <link rel="stylesheet" href="src/assets/bootstrap-icons.css" />
    <script src="src/assets/tailwind.min.js"></script>
    <script src="src/assets/jquery-3.7.1.min.js"></script>
    <script src="src/assets/gsap.min.js"></script>
  </head>
  <body class="min-h-screen pb-20">
    <!-- Preloader -->
    <div id="preloader">
      <div class="mb-6 opacity-80">
        <i class="bi bi-shield-shaded text-6xl" style="color: #d4af37"></i>
      </div>
      <span class="text-[#d4af37] text-sm tracking-[5px] font-bold"
        >پندار نیک . گفتار نیک . کردار نیک</span
      >
    </div>

    <div class="max-w-2xl mx-auto pt-6 px-4 sm:px-6">
      <!-- Toolbar -->
      <div class="mb-4 flex items-center justify-between gap-3 flex-wrap">
        <div
          class="flex items-center gap-2 rounded-xl p-2.5 border text-xs shadow-sm"
          style="
            background: var(--card-color);
            border-color: var(--border-color);
            backdrop-filter: blur(8px);
          "
        >
          <div
            class="flex items-center gap-1.5"
            style="color: var(--muted-color)"
          >
            <i class="bi bi-database"></i>
            <span id="sessionSize">--</span>
          </div>
          <div class="w-px h-4" style="background: var(--border-color)"></div>
          <div style="color: var(--muted-color)">
            <span id="sessionItems">۰</span> وظیفه
          </div>
          <div class="w-px h-4" style="background: var(--border-color)"></div>
          <button
            id="clearSessionBtn"
            class="text-red-400 hover:text-red-600 hover:bg-red-50 px-2 py-1 rounded-lg transition-all flex items-center gap-1 font-bold"
          >
            <i class="bi bi-trash3"></i>
          </button>
          <div class="w-px h-4" style="background: var(--border-color)"></div>
          <button
            id="backupBtn"
            class="text-blue-400 hover:text-blue-600 hover:bg-blue-50 px-2 py-1 rounded-lg transition-all flex items-center gap-1 font-bold"
            title="پشتیبان"
          >
            <i class="bi bi-download"></i>
          </button>
          <label
            class="text-green-400 hover:text-green-600 hover:bg-green-50 px-2 py-1 rounded-lg transition-all flex items-center gap-1 font-bold cursor-pointer"
            title="بازیابی"
          >
            <i class="bi bi-upload"></i>
            <input
              type="file"
              id="restoreInput"
              accept=".json"
              class="hidden"
            />
          </label>
        </div>
        <button
          id="themeSelector"
          class="rounded-xl p-2.5 border text-xs flex items-center gap-2 transition-all font-bold shadow-sm"
          style="
            background: var(--card-color);
            color: var(--text-color);
            border-color: var(--border-color);
          "
        >
          <i class="bi bi-moon-fill"></i>
          <span>تاریک</span>
        </button>
      </div>

      <!-- Daily Quote (Redesigned) -->
      <div
        class="mb-6 text-center rounded-2xl p-4 border shadow-sm"
        style="
          background: var(--card-color);
          border-color: var(--border-color);
          backdrop-filter: blur(8px);
        "
      >
        <div class="flex items-center justify-center gap-2 mb-2">
          <span style="color: var(--accent-color); font-size: 1.5rem">❝</span>
          <p
            id="dailyQuoteText"
            class="text-sm italic font-medium"
            style="color: var(--text-color)"
          ></p>
          <span style="color: var(--accent-color); font-size: 1.5rem">❞</span>
        </div>
        <p
          id="dailyQuoteAuthor"
          class="text-xs font-bold mt-1"
          style="color: var(--accent-color)"
        ></p>
      </div>

      <!-- Header -->
      <header
        class="mb-6 flex justify-between items-center pb-4 border-b"
        style="border-color: var(--border-color)"
      >
        <div class="flex items-center gap-4">
          <div
            class="w-12 h-12 rounded-lg flex items-center justify-center text-[#d4af37] shadow-lg"
            style="background: var(--primary-color)"
          >
            <i class="bi bi-trophy-fill text-xl"></i>
          </div>
          <div>
            <h1
              class="text-2xl font-black tracking-tight italic"
              style="color: var(--text-color)"
            >
              فرمانروایی بر زمان
            </h1>
            <p
              id="date-display"
              class="text-xs font-medium"
              style="color: var(--muted-color)"
            ></p>
          </div>
        </div>
        <span
          id="task-count"
          class="text-[10px] font-black px-3 py-1 rounded"
          style="background: var(--border-color); color: var(--muted-color)"
          >۰ / ۰</span
        >
      </header>

      <!-- Search & Filter -->
      <div class="mb-4 flex gap-2 items-center">
        <div class="relative flex-grow">
          <i
            class="bi bi-search absolute right-3 top-1/2 -translate-y-1/2 text-sm"
            style="color: var(--muted-color)"
          ></i>
          <input
            type="text"
            id="searchInput"
            placeholder="جستجوی زنده..."
            class="w-full rounded-xl py-2.5 pr-10 pl-4 text-sm outline-none transition-all shadow-sm"
            style="
              background: var(--card-color);
              color: var(--text-color);
              border: 1px solid var(--border-color);
            "
          />
        </div>
        <div class="flex gap-1">
          <button
            class="filter-btn text-white px-3 py-2 rounded-lg text-xs font-bold transition-all shadow-sm"
            style="background: var(--primary-color)"
            data-filter="همه"
          >
            همه
          </button>
          <button
            class="filter-btn px-3 py-2 rounded-lg text-xs font-bold transition-all"
            style="background: var(--border-color); color: var(--muted-color)"
            data-filter="فعال"
          >
            فعال
          </button>
          <button
            class="filter-btn px-3 py-2 rounded-lg text-xs font-bold transition-all"
            style="background: var(--border-color); color: var(--muted-color)"
            data-filter="انجام شده"
          >
            انجام
          </button>
        </div>
      </div>

      <!-- Input Box (Redesigned Todo Box) -->
      <div
        id="inputBox"
        class="rounded-3xl p-6 mb-8 shadow-lg border"
        style="
          background: var(--card-color);
          border-color: var(--border-color);
          backdrop-filter: blur(12px);
        "
      >
        <div class="flex flex-col gap-4">
          <input
            type="text"
            id="taskInput"
            placeholder="وظیفه جدید را وارد کنید..."
            class="w-full bg-transparent text-xl font-bold outline-none placeholder:opacity-50"
            style="color: var(--text-color)"
          />
          <textarea
            id="taskDescInput"
            placeholder="برای افزودن توضیحات، اینجا بنویسید..."
            class="w-full bg-transparent text-sm outline-none resize-none h-10 placeholder:opacity-40 border-r-2 pr-4"
            style="color: var(--text-color); border-color: var(--border-color)"
          ></textarea>
          <div class="flex items-center justify-between mt-2">
            <div class="dropdown-wrapper">
              <div
                id="dropdownTrigger"
                class="flex items-center gap-2 cursor-pointer text-xs font-bold px-3 py-2 rounded-md transition-all hover:bg-gray-50"
                style="color: var(--muted-color)"
              >
                <i
                  id="selectedIcon"
                  class="bi bi-person-fill text-blue-500"
                ></i>
                <span id="selectedLabel">شخصی</span>
                <i class="bi bi-chevron-down text-[10px]"></i>
              </div>
              <div
                id="customDropdown"
                class="absolute top-full mt-1 w-48 rounded-lg shadow-xl p-1 border hidden"
                style="
                  background: var(--card-color);
                  border-color: var(--border-color);
                "
              >
                <div
                  class="tag-opt p-2 hover:bg-gray-50 rounded cursor-pointer text-xs flex items-center gap-3"
                  data-val="شخصی"
                  data-icon="bi-person-fill"
                  data-color="text-blue-500"
                >
                  <i class="bi bi-person-fill text-blue-500"></i> امور شخصی
                </div>
                <div
                  class="tag-opt p-2 hover:bg-gray-50 rounded cursor-pointer text-xs flex items-center gap-3"
                  data-val="کاری"
                  data-icon="bi-briefcase-fill"
                  data-color="text-[#d4af37]"
                >
                  <i class="bi bi-briefcase-fill text-[#d4af37]"></i> امور کاری
                </div>
                <div
                  class="tag-opt p-2 hover:bg-gray-50 rounded cursor-pointer text-xs flex items-center gap-3"
                  data-val="ضروری"
                  data-icon="bi-fire"
                  data-color="text-red-500"
                >
                  <i class="bi bi-fire text-red-500"></i> اولویت بالا
                </div>
              </div>
            </div>
            <button
              id="addBtn"
              class="btn-empire px-8 py-2 rounded-xl text-xs font-black flex items-center gap-2 shadow-md transition-all"
            >
              <span>افزودن</span>
              <div
                id="btnLoader"
                class="hidden w-3 h-3 border-2 border-current border-t-transparent rounded-full animate-spin"
              ></div>
            </button>
          </div>
        </div>
      </div>

      <!-- Task List -->
      <div id="taskList" class="space-y-3"></div>
    </div>

    <script src="src/main.js"></script>
  </body>
</html>
